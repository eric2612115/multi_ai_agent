[tool.poetry]
name = "multi-ai-agent"
version = "0.1.0"
description = "Multi-model AI agent for knowledge exploration"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
fastapi = "^0.115.0"
uvicorn = "^0.32.1"
websockets = ">=13.0.0,<15.1.0"  # Updated for google-genai compatibility
python-dotenv = "^1.0.0"
anthropic = "^0.49.0"
motor = "^3.3.2"
pydantic = "^2.5.3"
pillow = "^10.1.0"
google-genai = "^1.9.0"
pydantic-settings = "^2.8.1"
redis = "^5.2.1"
pyjwt = "^2.10.1"
passlib = {version = ">=1.7.4", extras = ["bcrypt"]}
python-multipart = "^0.0.20"
bcrypt = "<4.0.0"
aiohttp = "^3.11.16"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
ruff = "^0.0.282"
mypy = "^1.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
