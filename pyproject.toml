[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi_ai_agent"
version = "0.1.0"
description = "Multi-AI Agent using MCP SDK to integrate multiple AI services"
readme = "README.md"
requires-python = ">=3.10"  # 更新為 3.10 以支援 mcp
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=0.3.0",
    "google-genai>=0.1.0",
    "anthropic>=0.15.0",
    "firecrawl-py>=0.1.0",
    "python-dotenv>=1.0.0",
    "pytest (>=8.3.5,<9.0.0)",
    "serpapi (>=0.1.5,<0.2.0)",
    "motor (>=3.7.0,<4.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.scripts]
multi-ai = "multi_ai_agent.cli:main"

[tool.black]
line-length = 88
target-version = ["py310"]  # 更新為 py310

[tool.isort]
profile = "black"
line_length = 88
